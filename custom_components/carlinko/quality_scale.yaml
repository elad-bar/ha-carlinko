rules:
  # Existing / bronze–silver (implemented)
  config-flow: done
  entity-unique-id: done
  entity-unavailable: done
  diagnostics: done
  parallel-updates: done
  reauthentication-flow: done
  exception-translations: done
  reconfiguration-flow: done
  entity-translations: done
  icon-translations: done
  entity-category: done
  entity-event-setup: done
  stale-devices: done
  test-before-setup: done
  log-when-unavailable: done
  config-entry-unloading: done
  docs-installation-instructions: done
  docs-configuration-parameters: done
  docs-known-limitations: done

  action-setup:
    status: exempt
    comment: No custom services; empty services.yaml placeholder only.

  appropriate-polling:
    status: done
    comment: >-
      Telemetry is cloud_push WebSocket. Location uses REST
      POST /maps/deviceLocate at LOCATION_POLL_INTERVAL_S (15 min) only when
      the vehicle supports maps locate; not the app's 5s map timer.

  discovery:
    status: exempt
    comment: Account hub login only; no DHCP/Zeroconf discovery.

  repair-issues:
    status: exempt
    comment: Auth failures use reauthentication flow; no separate repair issues.

  brands: done
